  responses:
    BadRequest:
      description: VALIDATION_ERROR; malformed JSON, invalid fields, query or path
        parameters.
      headers:
        X-Request-Id:
          description: Server-generated request UUID
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: TOKEN_EXPIRED, TOKEN_INVALID, REFRESH_TOKEN_INVALID.
      headers:
        X-Request-Id:
          description: Server-generated request UUID
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION.
      headers:
        X-Request-Id:
