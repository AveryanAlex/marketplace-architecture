[project]
name = "marketplace"
version = "0.1.0"
description = "Contract-first marketplace API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.8,<3",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=25,<26",
  "structlog>=25,<27",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "openapi-spec-validator>=0.7,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "generated/src"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
