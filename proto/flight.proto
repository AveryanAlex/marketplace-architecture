syntax = "proto3";
package flights.v1;

import "google/protobuf/timestamp.proto";

// Every method requires x-api-key metadata. Missing/invalid: UNAUTHENTICATED.
// Malformed fields: INVALID_ARGUMENT; database unavailable: UNAVAILABLE.
service FlightService {
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);
  // NOT_FOUND if the flight does not exist.
  rpc GetFlight(GetFlightRequest) returns (Flight);
  // RESOURCE_EXHAUSTED: insufficient seats. FAILED_PRECONDITION: non-scheduled
  // flight or released booking. ALREADY_EXISTS: booking_id reused with new data.
  // Idempotent for the same booking_id + flight_id + seat_count.
  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);
  // Idempotent; a missing reservation creates a release tombstone so a delayed
  // ReserveSeats cannot recreate a reservation after compensation.
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  // NOT_FOUND, FAILED_PRECONDITION if capacity is below active reservations.
  rpc UpdateFlight(UpdateFlightRequest) returns (Flight);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  SCHEDULED = 1;
  DEPARTED = 2;
  CANCELLED = 3;
  COMPLETED = 4;
}
enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  RELEASED = 2;
  EXPIRED = 3;
}
message Flight {
  string id = 1;
  string flight_number = 2;
  string airline = 3;
  string origin = 4;
  string destination = 5;
  google.protobuf.Timestamp departure_at = 6;
  google.protobuf.Timestamp arrival_at = 7;
  int32 total_seats = 8;
  int32 available_seats = 9;
  // Integer kopecks (RUB), never floating point.
  int64 price_minor = 10;
  FlightStatus status = 11;
}
message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  // Optional; interpreted as a UTC calendar date. Omit to search all dates.
  google.protobuf.Timestamp departure_date = 3;
}
message SearchFlightsResponse { repeated Flight flights = 1; }
message GetFlightRequest { string flight_id = 1; }
message ReserveSeatsRequest {
  string flight_id = 1;
  string booking_id = 2;
  int32 seat_count = 3;
}
message SeatReservation {
  string id = 1;
  string flight_id = 2;
  string booking_id = 3;
  int32 seat_count = 4;
  ReservationStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}
message ReleaseReservationRequest { string booking_id = 1; }
message ReleaseReservationResponse {
  string booking_id = 1;
  ReservationStatus status = 2;
}
message UpdateFlightRequest {
  string flight_id = 1;
  optional int64 price_minor = 2;
  optional int32 total_seats = 3;
  optional FlightStatus status = 4;
}
