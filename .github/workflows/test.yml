name: Cinema pipeline
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: make lint
      - run: make test
      - run: make demo
      - run: python3 scripts/fault_checks.py
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Cleanup
        if: always()
        run: docker compose --profile test down -v
