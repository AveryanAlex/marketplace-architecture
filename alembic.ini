[alembic]
script_location = %(here)s/migrations
prepend_sys_path = . generated/src
path_separator = space
sqlalchemy.url = postgresql+asyncpg://marketplace:marketplace@localhost:15432/marketplace

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = {"event": "migration", "level": "%(levelname)s", "message": "%(message)s"}
